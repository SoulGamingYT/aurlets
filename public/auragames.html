<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraGames - Aurlets</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: #000;
    color: white;
    font-family: system-ui;
}

.topbar {
    text-align: center;
    padding: 30px;
    border-bottom: 1px solid #222;
}

.title {
    font-size: 40px;
    font-weight: 800;
    background: linear-gradient(90deg,#ec4899,#8b5cf6);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #9ca3af;
    margin-top: 5px;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 40px;
    display: grid;
    gap: 25px;
}

.card {
    background: #111;
    border: 1px solid #222;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 0 25px rgba(0,0,0,.6);
    transition: transform .2s;
    cursor: pointer;
}

.card:hover {
    transform: scale(1.05);
}

.card-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
}

.card-desc {
    color: #9ca3af;
}

.coming-soon {
    opacity: 0.5;
    cursor: default;
}
</style>
</head>
<body>

<header class="topbar">
    <h1 class="title">AuraGames - Beta1.0</h1>
    <p class="subtitle">Select a game to play</p>
</header>

<main class="container">

    <!-- Maths Game -->
    <div class="card" onclick="location.href='https://aurlets.up.railway.app/maths.html'">
        <h2 class="card-title">Maths.io</h2>
        <p class="card-desc">Test your math skills with multiplayer challenges.</p>
    </div>

    <!-- King of Diamonds -->
    <div class="card" onclick="location.href='https://aurlets.up.railway.app/kotdGame.html'">
        <h2 class="card-title">King of the Diamonds - Number Royale</h2>
        <p class="card-desc">Enter numbers, survive rounds, and become the last player standing!</p>
    </div>

    <!-- Coming Soon -->
    <div class="card coming-soon">
        <h2 class="card-title">Coming Soon</h2>
        <p class="card-desc">More exciting multiplayer games will be added here!</p>
    </div>

</main>

</body>
</html>
