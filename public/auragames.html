<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurlets – AuraGames</title>
  <link rel="icon" href="https://i.postimg.cc/DZF2WXYD/aurlets.webp" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .gradient-text {
      background: linear-gradient(90deg, #ff00ff, #8000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glow {
      text-shadow: 0 0 20px rgba(255,0,255,0.7), 0 0 40px rgba(128,0,255,0.7);
    }
    body {
      background-color: #000;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 16px; /* smoother edges */
      border: 2px solid #ff00ff; /* subtle border */
      background: linear-gradient(45deg, #ff00ff, #8000ff);
      box-shadow: 0 0 20px rgba(255,0,255,0.5);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
      max-width: 90%;
      width: auto;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255,0,255,0.7);
      background: linear-gradient(45deg, #ff99ff, #b266ff);
    }
    .fool-text {
      font-size: 1.8rem;
      margin-top: 20px;
      color: #ff00ff;
      display: none;
      animation: pop 0.5s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .video-container {
      display: none;
      margin-top: 30px;
      width: 100%;
      max-width: 560px;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <img src="https://i.postimg.cc/DZF2WXYD/aurlets.webp" class="w-20 h-20 mb-6 animate-bounce mx-auto" alt="Aurlets Logo"/>
  <h1 class="text-5xl font-extrabold gradient-text glow">AuraGames</h1>
  <p class="mt-4 text-gray-300 max-w-xl mx-auto">Click below to enter the game zone… or maybe not 😉</p>

  <button id="enterBtn">Enter AuraGames</button>

  <div class="fool-text" id="foolText">APRIL FOOLS! 😜 You just got Rickrolled!</div>

  <div class="video-container" id="rickroll"></div>

  <script>
    const btn = document.getElementById('enterBtn');
    const videoContainer = document.getElementById('rickroll');
    const foolText = document.getElementById('foolText');

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      foolText.style.display = 'block';
      videoContainer.style.display = 'block';

      // Create iframe dynamically for autoplay to work
      const iframe = document.createElement('iframe');
      iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0";
      iframe.allow = "autoplay; encrypted-media";
      iframe.allowFullscreen = true;
      iframe.style.borderRadius = '12px';
      videoContainer.appendChild(iframe);
    });
  </script>

</body>
</html>
