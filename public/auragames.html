<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraGames</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px 20px;
      background-color: #f0f0f0;
    }

    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1.1rem;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #ff6f61;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s;
      max-width: 90%;
    }

    button:hover {
      background-color: #ff4c3b;
    }

    .video-container {
      margin-top: 30px;
      display: none;
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Welcome to AuraGames!</h1>
  <p>Click the button below to enter the game zone 🎮</p>
  <button id="enterBtn">Enter AuraGames</button>

  <div class="video-container" id="rickroll">
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" 
      allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>
  </div>

  <script>
    const btn = document.getElementById('enterBtn');
    const videoContainer = document.getElementById('rickroll');

    btn.addEventListener('click', () => {
      videoContainer.style.display = 'block'; // show the video
      btn.style.display = 'none';             // hide the button
    });
  </script>

</body>
</html>
