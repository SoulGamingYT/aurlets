<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurlets</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#0a0a0a;
color:white;
font-family:system-ui;
text-align:center;
padding-top:100px;
overflow:hidden;
}

.glitch{
animation:shake .1s infinite;
}

@keyframes shake{
0%{transform:translate(2px,1px)}
25%{transform:translate(-2px,-1px)}
50%{transform:translate(1px,-2px)}
75%{transform:translate(-1px,2px)}
100%{transform:translate(2px,-1px)}
}

.popup{
position:fixed;
background:white;
color:black;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

button{
padding:12px 20px;
background:#9333ea;
border-radius:10px;
}

</style>

</head>

<body>

<h1 id="title" class="text-5xl font-bold">
Aurlets Games
</h1>

<p class="mt-5 text-gray-400">
Loading system modules...
</p>

<button id="start" class="mt-8">
Start Game
</button>

<script>

function random(min,max){
return Math.random()*(max-min)+min
}

function createPopup(){

const popup=document.createElement("div")

popup.className="popup"

popup.style.left=random(0,window.innerWidth-200)+"px"
popup.style.top=random(0,window.innerHeight-100)+"px"

popup.innerText="System Error 0xAURLETS"

document.body.appendChild(popup)

}

setTimeout(()=>{

document.body.classList.add("glitch")

setInterval(createPopup,800)

},3000)

setTimeout(()=>{

document.body.innerHTML=`

<h1 style="font-size:60px">😂 APRIL FOOLS</h1>

<p style="margin-top:20px;color:#aaa">
Aurlets website is perfectly fine.
You just got pranked.
</p>

<button onclick="location.href='/'">
Return Home
</button>

`

},12000)

</script>

</body>
</html>
