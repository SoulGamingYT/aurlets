<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraGames - April Fools!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Neue', cursive;
      text-align: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
    }

    button {
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      background-color: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 6px #d04c45;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #ff4c3b;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px #d04c45;
    }

    .video-container {
      margin-top: 30px;
      display: none;
      position: relative;
      width: 90%;
      max-width: 560px;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    .fool-text {
      display: none;
      font-size: 1.8rem;
      color: #ff0000;
      margin-top: 30px;
      animation: pop 0.5s ease-out forwards;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Welcome to AuraGames!</h1>
  <p>Click the button below to enter the game zone 🎮</p>
  <button id="enterBtn">Enter AuraGames</button>

  <div class="fool-text" id="foolText">APRIL FOOLS! 😜</div>

  <div class="video-container" id="rickroll">
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" 
      allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>
  </div>

  <script>
    const btn = document.getElementById('enterBtn');
    const videoContainer = document.getElementById('rickroll');
    const foolText = document.getElementById('foolText');

    btn.addEventListener('click', () => {
      btn.style.display = 'none';            // hide button
      foolText.style.display = 'block';      // show APRIL FOOLS text
      videoContainer.style.display = 'block'; // show video
    });
  </script>

</body>
</html>
