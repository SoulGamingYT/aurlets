<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
body { background:#000; color:white; font-family:system-ui; }
.card { background:#111; padding:20px; border-radius:10px; margin:20px; }
.input { width:100%; padding:10px; border-radius:5px; background:#000; border:1px solid #333; margin-bottom:10px; }
.btn { padding:10px; border-radius:5px; background:linear-gradient(90deg,#8b5cf6,#ec4899); cursor:pointer; }
.timer { font-size:28px; color:#f87171; }
.log { height:120px; overflow:auto; font-size:14px; color:#9ca3af; }
</style>
</head>
<body>

<div class="card">
<h2>Question:</h2>
<div id="question">Waiting for round...</div>
<input id="answer" class="input" placeholder="Your answer">
<button onclick="submitAnswer()" class="btn">Submit</button>
<div id="timer" class="timer">0</div>
</div>

<div class="card">
<h2>Players:</h2>
<ul id="players"></ul>
</div>

<div class="card">
<h2>Game Log:</h2>
<div id="log" class="log"></div>
</div>

<script src="game.js"></script>
</body>
</html>
