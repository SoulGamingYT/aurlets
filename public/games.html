<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurlets Games</title>

<link rel="icon" href="https://i.postimg.cc/DZF2WXYD/aurlets.webp">

<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>

<style>

body{
background:#000;
color:white;
font-family:system-ui;
}

.topbar{
text-align:center;
padding:30px;
border-bottom:1px solid #222;
}

.title{
font-size:40px;
font-weight:800;
background:linear-gradient(90deg,#ec4899,#8b5cf6);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
color:#9ca3af;
margin-top:5px;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
display:grid;
gap:25px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:15px;
padding:25px;
box-shadow:0 0 25px rgba(0,0,0,.6);
}

.card-title{
font-size:20px;
margin-bottom:15px;
font-weight:700;
}

.input{
width:100%;
padding:10px;
border-radius:10px;
background:#000;
border:1px solid #333;
margin-bottom:10px;
}

.btn{
padding:10px 18px;
border-radius:10px;
background:linear-gradient(90deg,#8b5cf6,#ec4899);
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:scale(1.05);
}

.question{
font-size:20px;
margin-bottom:20px;
}

.answer-area{
display:flex;
gap:10px;
}

.timer{
font-size:28px;
margin-top:20px;
color:#f87171;
}

.log{
height:120px;
overflow:auto;
font-size:14px;
color:#9ca3af;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header class="topbar">

<h1 class="title">King of Diamonds</h1>
<p class="subtitle">Aurlets Multiplayer Logic Game</p>

</header>

<main class="container">

<div id="lobby" class="card">

<h2 class="card-title">Join Game</h2>

<input id="username" class="input" placeholder="Enter name">

<button onclick="joinGame()" class="btn">
Join Lobby
</button>

</div>

<div id="gameArea" class="hidden">

<div class="card">

<h2 class="card-title">Puzzle</h2>

<div id="question" class="question">
Waiting for round...
</div>

<div class="answer-area">

<input id="answer" class="input" placeholder="Your answer">

<button onclick="submitAnswer()" class="btn">
Submit
</button>

</div>

<div id="timer" class="timer">60</div>

</div>

<div class="card">

<h2 class="card-title">Players</h2>
<ul id="players"></ul>

</div>

<div class="card">

<h2 class="card-title">Game Log</h2>
<div id="log" class="log"></div>

</div>

</div>

</main>

<script>

const socket = io()

let username = ""

const lobby = document.getElementById("lobby")
const gameArea = document.getElementById("gameArea")
const playersList = document.getElementById("players")
const logBox = document.getElementById("log")

function joinGame(){

username = document.getElementById("username").value

if(!username) return

socket.emit("join",username)

lobby.classList.add("hidden")
gameArea.classList.remove("hidden")

log("Joined lobby")

}

function submitAnswer(){

const answer = document.getElementById("answer").value

socket.emit("answer",answer)

document.getElementById("answer").value=""

}

socket.on("players",(players)=>{

playersList.innerHTML=""

players.forEach(p=>{

const li=document.createElement("li")
li.innerText = p.name + " — " + p.score

playersList.appendChild(li)

})

})

socket.on("question",(q)=>{
document.getElementById("question").innerText = q
})

socket.on("timer",(t)=>{
document.getElementById("timer").innerText = t
})

socket.on("log",(msg)=>{
log(msg)
})

function log(text){

const div=document.createElement("div")
div.innerText=text

logBox.appendChild(div)

logBox.scrollTop = logBox.scrollHeight

}

</script>

</body>
</html>
