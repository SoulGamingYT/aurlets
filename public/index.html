<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurlets 2.0</title>
  <link rel="icon" href="https://i.postimg.cc/DZF2WXYD/aurlets.webp" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { margin:0; font-family:sans-serif; background:#000; color:#fff; overflow-x:hidden; }
    .gradient-text { background: linear-gradient(90deg,#ff00ff,#8000ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .glow { text-shadow:0 0 20px rgba(255,0,255,0.7),0 0 40px rgba(128,0,255,0.7); }
    .shake { animation: shake 0.15s infinite; }
    @keyframes shake {
      0%{transform:translate(2px,1px);}25%{transform:translate(-2px,-1px);}50%{transform:translate(1px,-2px);}75%{transform:translate(-1px,2px);}100%{transform:translate(2px,-1px);}
    }
    #launchOverlay {position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;z-index:10000;}
    #launchOverlay button {padding:20px 40px; font-size:1.5rem; font-weight:bold; background:linear-gradient(90deg,#ff00ff,#8000ff); border:none; border-radius:12px; color:white; cursor:pointer; box-shadow:0 0 20px rgba(255,0,255,0.5);}
    #mainContent {opacity:0; transition:opacity 1s;}
  </style>
</head>
<body>

  <!-- Launch Overlay -->
  <div id="launchOverlay">
    <button id="launchBtn">🚀 Launch Website 2.0</button>
  </div>

  <!-- MAIN HOMEPAGE CONTENT -->
  <div id="mainContent">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-white/10 p-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://i.postimg.cc/DZF2WXYD/aurlets.webp" alt="Aurlets Logo" class="w-10 h-10 rounded">
        <span class="text-2xl font-extrabold gradient-text glow">Aurlets</span>
      </div>
      <nav class="hidden md:flex gap-4 text-sm text-gray-300">
        <a href="#" class="px-3 py-1 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 shadow">Info</a>
        <a href="#" class="px-3 py-1 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 shadow">Announcements</a>
        <a href="#" class="px-3 py-1 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 shadow">Discord</a>
      </nav>
    </header>

    <!-- HERO -->
    <section class="relative overflow-hidden py-20" style="background-image:url('media/background.gif'); background-size:cover;">
      <div class="absolute inset-0 bg-black/50"></div>
      <div class="relative z-10 text-center max-w-5xl mx-auto px-6">
        <img src="https://i.postimg.cc/DZF2WXYD/aurlets.webp" class="w-20 h-20 mx-auto mb-6 animate-bounce"/>
        <h1 class="text-5xl md:text-6xl font-extrabold gradient-text glow">Aurlets – The Aura Farmers</h1>
        <p class="mt-4 text-xl italic text-gray-300">“Young, Black and Rich”</p>
      </div>
    </section>

    <!-- VIDEO -->
    <section class="text-center py-20">
      <h2 class="text-3xl font-bold mb-6 gradient-text glow">APRIL FOOLS 😂</h2>
      <div style="width:90%; max-width:600px; aspect-ratio:16/9; margin:auto;">
        <iframe id="mainVideo" width="100%" height="100%"
          src="https://www.youtube.com/embed/Aq5WXmQQooo?enablejsapi=1"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </div>

  <!-- AUDIO ELEMENTS -->
  <audio id="meowAudio" src="media/meow.mp3"></audio>
  <audio id="fahhAudio" src="media/fahh.mp3" loop></audio>
  <audio id="chickenAudio" src="media/chicken.mp3" loop></audio>
  <audio id="aughAudio" src="media/augh.mp3" loop></audio>

  <script>
    const launchBtn = document.getElementById("launchBtn");
    const launchOverlay = document.getElementById("launchOverlay");
    const mainContent = document.getElementById("mainContent");

    launchBtn.addEventListener("click", () => {
      // Show main content
      launchOverlay.style.display = "none";
      mainContent.style.opacity = "1";

      // Play Meow Audio (prank start)
      const meow = document.getElementById("meowAudio");
      meow.play();

      // Start Hack Prank after 3 seconds
      setTimeout(() => startPrankFlow(), 3000);
    });

    function startPrankFlow() {
      // ======= SHAKE EFFECT =======
      document.body.classList.add("shake");

      // ======= FAKE HACK BOX =======
      const infoBox = document.createElement("div");
      infoBox.style.position = "fixed";
      infoBox.style.top = "20%";
      infoBox.style.left = "50%";
      infoBox.style.transform = "translateX(-50%)";
      infoBox.style.background = "black";
      infoBox.style.border = "2px solid red";
      infoBox.style.padding = "20px";
      infoBox.style.zIndex = "9999";
      infoBox.style.textAlign = "center";
      infoBox.style.fontFamily = "monospace";
      infoBox.style.color = "lime";
      infoBox.innerHTML = "<h2>Initializing Security Scan...</h2>";
      document.body.appendChild(infoBox);

      // ======= RANDOM ALERTS / POPUPS =======
      const popups = [
        "WARNING! SYSTEM BREACH DETECTED!",
        "ERROR 0x404: Aura Not Found",
        "Connecting to mainframe...",
        "Injecting virus...",
        "Hacking your aura...",
        "Just Kidding 😎"
      ];

      let i = 0;
      const popupInterval = setInterval(() => {
        if (i >= popups.length) {
          clearInterval(popupInterval);
          showVideoOverlay(); // after fake hack complete
          return;
        }
        const popup = document.createElement("div");
        popup.style.position = "fixed";
        popup.style.top = Math.random()*80 + "%";
        popup.style.left = Math.random()*80 + "%";
        popup.style.background = "black";
        popup.style.color = "red";
        popup.style.border = "2px solid lime";
        popup.style.padding = "10px";
        popup.style.zIndex = 10001 + i;
        popup.style.fontFamily = "monospace";
        popup.innerText = popups[i];
        document.body.appendChild(popup);
        setTimeout(()=>{popup.remove();},1500);
        i++;
      }, 1000);

      // ======= VIDEO AUDIO CHAOS =======
      function showVideoOverlay() {
        infoBox.remove();
        document.body.classList.remove("shake");

        // Play chaotic audios
        document.getElementById("fahhAudio").play();
        document.getElementById("chickenAudio").play();
        document.getElementById("aughAudio").play();
      }
    }
  </script>

</body>
</html>
